<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Radio Console - Clandestine Receiver</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --amber-glow: #ffb733; --dim-amber: rgba(255, 183, 51, 0.15); }
        html, body { max-width: 100%; overflow-x: hidden; box-sizing: border-box; margin: 0; padding: 0; }
        *, *:before, *:after { box-sizing: inherit; }
        
        body {
            background: #050302 url('photo/background.png') center/cover fixed no-repeat;
            color: #d8c2a8; font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh; padding: 20px; user-select: none;
            position: relative;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at center, rgba(40, 20, 8, 0.4) 0%, rgba(5, 3, 2, 0.9) 85%);
            pointer-events: none; z-index: 1;
        }

        .scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 10;
            background: linear-gradient(rgba(18, 16, 14, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            opacity: 0.6;
        }

        .console-container {
            position: relative; width: 100%; max-width: 900px; aspect-ratio: 16 / 9;
            background: #2b1408 url('photo/radioconsole image.jpg') center/100% 100% no-repeat;
            box-shadow: 0 40px 80px rgba(0,0,0,0.98), 0 0 30px rgba(255, 130, 0, 0.05);
            border-radius: 12px; overflow: hidden; z-index: 2;
            border: 2px solid rgba(40, 20, 10, 0.8);
        }

        .interactive-volume { position: absolute; top: 24%; left: 5.5%; width: 8%; height: 20%; cursor: pointer; border-radius: 50%; }
        .interactive-tuning { position: absolute; top: 24%; right: 5.5%; width: 8%; height: 20%; cursor: pointer; border-radius: 50%; }
        .interactive-dial { position: absolute; top: 21.5%; left: 17%; right: 17%; height: 27%; cursor: grab; touch-action: none; }
        .interactive-dial:active { cursor: grabbing; }
        
        .tuning-indicator-bar {
            position: absolute; top: 27.3%; height: 5.2%; width: 10px;
            background: linear-gradient(to bottom, rgba(255,150,0,0.6), #ffe885 50%, rgba(255,150,0,0.6));
            border-radius: 2px; box-shadow: 0 0 10px 2px var(--amber-glow), inset 0 0 3px #fff;
            transform: translateX(-50%); pointer-events: none; transition: left 0.05s ease-out; z-index: 3;
        }

        .screen-display {
            position: absolute; top: 53.5%; left: 27%; right: 27%; height: 10.5%;
            background: rgba(12, 6, 2, 0.9); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 11px;
            color: var(--amber-glow); letter-spacing: 1.5px; text-shadow: 0 0 8px var(--amber-glow);
            box-shadow: inset 0 0 12px rgba(255, 157, 0, 0.25); padding: 0 10px; text-align: center; z-index: 5;
            font-family: monospace, monospace;
        }

        .visualizer { position: absolute; top: 73.5%; left: 5%; right: 5%; height: 12.5%; pointer-events: none; z-index: 4; }
        #visualizerCanvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="console-container">
        <div class="interactive-volume" id="volumeTrigger"></div>
        <div id="tuningBar" class="tuning-indicator-bar" style="left: 50%;"></div>
        <div class="interactive-dial" id="dialWindow"></div>
        <div class="interactive-tuning" id="tuningTrigger"></div>
        <div class="screen-display" id="stationDisplay">RECEIVER STATUS: STANDBY... TAP DIAL TO POWER ON</div>
        <div class="visualizer"><canvas id="visualizerCanvas"></canvas></div>
    </div>

    <audio id="mainAudio" preload="auto" playsinline crossorigin="anonymous"></audio>
    <script>
        const tuningBar = document.getElementById('tuningBar');
        const stationDisplay = document.getElementById('stationDisplay');
